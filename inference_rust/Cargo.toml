[package]
name = "yolo-infer"
version = "0.1.0"
edition = "2021"
description = "YOLO11n 实时推理（Rust + ONNX Runtime），用于对比/优化 Python 版本性能"

[lib]
name = "yolo_infer"
path = "src/lib.rs"

[[bin]]
name = "yolo-infer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
imageproc = "0.27"
ab_glyph = "0.2"
ndarray = "0.17"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"] }
nokhwa = { version = "0.10.11", features = ["input-native", "decoding", "rgb"], optional = true }

[features]
default = []
camera = ["dep:nokhwa"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
